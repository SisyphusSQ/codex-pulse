name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  center:
    name: Center and embedded Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: server/web/package-lock.json
      - run: make web-install
      - name: Web behavior and embedded build
        run: |
          cd web
          npm test
          npm run build
      - name: Center verification
        run: make verify
      - name: Release packaging
        run: make package-center VERSION=ci
      - name: Operations script syntax
        run: |
          bash -n scripts/mysql-backup.sh
          python3 -m py_compile scripts/deadline.py scripts/macos-service.py
      - name: Ensure tracked files remain unchanged
        run: git diff --exit-code

  verify:
    name: Product verification
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install pinned protobuf toolchain
        run: |
          brew install protobuf@34
          echo "$(brew --prefix protobuf@34)/bin" >>"$GITHUB_PATH"

      - name: Run unified verification
        run: make verify

      - name: Ensure repository remains clean
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            printf 'verification left repository changes:\n%s\n' "$status" >&2
            exit 1
          fi
