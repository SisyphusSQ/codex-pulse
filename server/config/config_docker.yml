---
debug: false
contextTimeout: 10s

server:
    metrics: true
    readinessTimeout: 2s
    address: ":8080"
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s
    maxBodyBytes: 8388608
    corsOrigins:
        - "https://pulse.example.com"
    origins:
        - "https://pulse.example.com"
    allowHTTP: false
    trustedProxies: []
    webDirectory: "web/dist"
database:
    enabled: true
    driver: "mysql"
    host: "mysql"
    port: 3306
    database: "test"
    username: "app"
    password: ""
    maxIdleConns: 20
    maxOpenConns: 100
    connMaxLifetime: 5m
    charset: "utf8mb4"
    timeZone: "Local"
    name: "pulse_center"
    path: "/var/lib/pulse/pulse.sqlite"
    tls: "true"





log:
    output: "stdout"
    fileName: "logs/server.log"
    logLevel: 0
    maxSizeMB: 20
    maxBackupCount: 30
    maxKeepDays: 7
