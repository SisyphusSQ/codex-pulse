---
debug: false
contextTimeout: 10s

server:
    metrics: true
    metricsTokenFile: "" # Prometheus 专用只读 Token 文件，权限 0600；空值仅保留浏览器授权采集
    readinessTimeout: 2s
    address: ":8080"
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s
    maxBodyBytes: 8388608
    corsOrigins: ["*"] # 通配跨域不允许携带 Cookie；内嵌 Web 使用同源 API
    origins:
        - "https://pulse.example.com"
    allowHTTP: false
    trustedProxies: []
database:
    enabled: true
    driver: "mysql"
    host: "mysql"
    port: 3306
    database: "pulse_center"
    username: "app"
    password: ""
    maxIdleConns: 20
    maxOpenConns: 100
    connMaxLifetime: 5m
    charset: "utf8mb4"
    timeZone: "UTC"
    name: "pulse_center"
    path: "/var/lib/pulse/pulse.sqlite"
    tls: "true"





log:
    output: "stdout"
    fileName: "logs/server.log"
    logLevel: 0
    maxSizeMB: 20
    maxBackupCount: 30
    maxKeepDays: 7
