---
debug: true
contextTimeout: 10s

server:
    quotaMaintenance: false # 显式启用后，启动及每小时精简额度至四周期；先备份数据库
    metrics: true
    metricsTokenFile: "" # Prometheus 专用只读 Token 文件，权限 0600；空值仅保留浏览器授权采集
    readinessTimeout: 2s
    address: "127.0.0.1:8080"
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s
    maxBodyBytes: 8388608
    corsOrigins: ["*"] # 通配跨域不允许携带 Cookie；内嵌 Web 使用同源 API
    origins:
        - "http://127.0.0.1:8080"
    allowHTTP: true
    trustedProxies: []
database:
    enabled: true
    driver: "sqlite"
    host: "127.0.0.1"
    port: 3306
    database: "test"
    username: "root"
    password: ""
    maxIdleConns: 20
    maxOpenConns: 100
    connMaxLifetime: 5m
    charset: "utf8mb4"
    timeZone: "UTC"
    name: "pulse_center"
    path: ".runtime/pulse.sqlite"
    tls: "true"





log:
    output: "stdout"
    fileName: "logs/server.log"
    logLevel: 0
    maxSizeMB: 20
    maxBackupCount: 30
    maxKeepDays: 7
