---
debug: false
contextTimeout: 10s

server:
    metrics: false
    readinessTimeout: 2s
    address: "127.0.0.1:8080"
    readHeaderTimeout: 5s
    readTimeout: 15s
    writeTimeout: 15s
    idleTimeout: 60s
    shutdownTimeout: 10s
    maxBodyBytes: 8388608
    corsOrigins: []
    origins: ["http://127.0.0.1:8080"]
    allowHTTP: true
    trustedProxies: []
    webDirectory: "/opt/codex-pulse/center/web"
database:
    enabled: true
    driver: "sqlite"
    host: "127.0.0.1"
    port: 3306
    database: "test"
    username: "root"
    password: ""
    maxIdleConns: 20
    maxOpenConns: 100
    connMaxLifetime: 5m
    charset: "utf8mb4"
    timeZone: "UTC"
    name: "pulse_center"
    path: "/var/lib/codex-pulse/center.sqlite"
    tls: "true"





log:
    output: "file"
    fileName: "/var/lib/codex-pulse/logs/server.log"
    logLevel: 0
    maxSizeMB: 20
    maxBackupCount: 30
    maxKeepDays: 7
