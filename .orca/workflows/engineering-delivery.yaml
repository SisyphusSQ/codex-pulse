schema_version: 2
name: engineering-delivery

coordinator:
  surface: codex-app
  heartbeat:
    kind: heartbeat
    create_after: first_dispatch_started
    interval_seconds: 120
    target: current-thread
    model: inherit-current-thread
    stop_on: verified_handoff

run_driver:
  type: deterministic
  runtime: orca-terminal
  protocol: jsonl-v1
  progression: heartbeat-supervised
  worker_start_timeout_ms: 120000

workspace:
  mode: current
  allow_new_worktree: false
  branch:
    mode: repository-policy
    default_name_template: suqing/{issue_id_lower}-{slug}
    base: remote-default
    sync: ff-only
    repository_policy_precedence: true

preflight:
  providers:
    mode: exact-profile-probe
    update_prompt: fail-before-run
    trust_prompt: fail-before-run
    close_probe_terminal: true
  repository:
    read_back: [status, branch, upstream, remote]
    branch_before_orca: true

agent_profiles:
  codex-luna-max-yolo:
    runtime: codex
    model: gpt-5.6-luna
    effort: max
    speed: standard
    permission_mode: yolo
    apps_mode: disabled
    mcp_servers_disabled: []

  codex-sol-xhigh-yolo:
    runtime: codex
    model: gpt-5.6-sol
    effort: xhigh
    speed: standard
    permission_mode: yolo
    apps_mode: disabled
    mcp_servers_disabled: []

  cursor-grok-4-6-xhigh-yolo:
    runtime: cursor
    model: cursor-grok-4.6-xhigh
    effort: provider-default
    speed: standard
    permission_mode: yolo
    sandbox_mode: enabled

  grok-build-grok-4-6-xhigh-yolo:
    runtime: grok
    model: grok-4.6
    effort: xhigh
    speed: provider-default
    permission_mode: yolo

  cursor-opus-5-xhigh-yolo:
    runtime: cursor
    model: claude-opus-5-thinking-xhigh
    effort: provider-default
    speed: standard
    permission_mode: yolo
    sandbox_mode: enabled

flow:
  - plan
  - develop
  - review_fix
  - verify

stages:
  plan:
    kind: agent
    tracked_mutation: forbidden
    fresh_terminal: always
    agent:
      primary: cursor-opus-5-xhigh-yolo
  develop:
    kind: agent
    tracked_mutation: allowed
    fresh_terminal: always
    agent:
      primary: grok-build-grok-4-6-xhigh-yolo
  review_fix:
    kind: agent
    tracked_mutation: allowed
    fresh_terminal: always
    agent:
      primary: codex-sol-xhigh-yolo
  verify:
    kind: command
    tracked_mutation: forbidden
    command:
      argv: [git, diff, --check]
      timeout_seconds: 1200
      no_output_probe_seconds: 120
  verify_fix:
    kind: agent
    tracked_mutation: allowed
    fresh_terminal: always
    agent:
      primary: codex-sol-xhigh-yolo

context:
  linear:
    include: [description, comments, attachments, children, relations]
    refresh: [run_start, before_review, before_verified_handoff]
    propagation: coordinator_summary

limits:
  review_fix_agents: 3
  verify_repair_rounds: 2

liveness:
  heartbeat:
    enabled: true
    interval_seconds: 60
    missed_before_probe: 3
    timeout_is_completion: false
    completion_signal: worker_done

worker_lifecycle:
  default_on_settled: retain
  reuse_requires_same_profile: true
  terminal_retention:
    mode: retain_until_explicit_cleanup
    max_retained: 20
    on_limit: require_cleanup
  plan:
    on_settled: retain
  develop:
    on_settled: retain
  review_fix:
    on_settled: retain
  verify_fix:
    on_settled: retain
  pause:
    retain_while_coordinator_active: true
    release_on_long_pause: false
  debug:
    retain_only_when_user_requested: true

stage_results:
  schema: stage-result-v1
  control_result: worker_done
  report:
    required: true
    directory: .orca/runtime/<runtime-id>/reports
    version_controlled: false

repairs:
  review_fix:
    fresh_agent_each_round: true
    repeat_when: tracked_changes
    exit_requires: [approved, clean_tracked_state]
  verify:
    stage: verify_fix
    return_to: review_fix
    fresh_review_after_fix: true

post_orca:
  handoff:
    mode: verified-handoff
    executor: codex-app
    requires: [verify_passed, exact_git_identity, reports_persisted]
  checkpoint:
    executor: codex-app
    mode: local-commit
    before: live_e2e
    evidence_identity: committed_sha
  live_e2e:
    executor: codex-app
    placement: after_orca_verify
    default_gate: user-required
    explicit_full_auto_gate: none
    evidence_identity: committed_sha
    cleanup_evidence: required
    pause_on_failure: true
    continue_on_pass: true
  ship:
    executor: codex-app
    skill: personal-thin-skills:ship-current-branch
    after: live_e2e_passed
    repository_policy_precedence: true

updates:
  linear:
    mode: milestones
    milestones: [plan_completed, blocked, review_completed, verified_handoff]
    use_comment_thread: true
